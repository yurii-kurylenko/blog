# Continuous deployment of the Hugo site to GitHub Pages.
#
# Follows Hugo's documented GitHub Pages deployment pattern:
# https://gohugo.io/host-and-deploy/host-on-github-pages/
#
# One-time repository setting, owned by a human: Settings > Pages > Source must be
# set to "GitHub Actions". Until that is selected, Pages does not exist for this
# repository and the "Setup Pages" step fails with an explicit message.
# No deployment secret is stored: the deploy job authenticates with the GitHub
# OIDC token minted from the id-token permission below.

name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege for this flow: read the repository, publish the Pages artifact,
# and mint the OIDC token that deploy-pages exchanges for a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a queued run waits instead of cancelling a
# deployment that is already halfway published.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Pinned for reproducible builds. PaperMod declares a minimum supported Hugo
  # version of 0.146.0 (themes/PaperMod/theme.toml) and documents the extended
  # binary, which is what is installed below.
  HUGO_VERSION: 0.166.0
  # Hugo's production environment is the default, but it is stated here so the
  # deploy build is never ambiguous.
  HUGO_ENVIRONMENT: production
  # No TZ override on purpose: the project keeps Hugo's UTC default (see the
  # comment in hugo.toml) so build dates do not depend on the runner's locale.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The PaperMod theme is a Git submodule; a clone without it cannot build.
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log Hugo version
        run: hugo version

      - name: Build with Hugo
        # The base URL is taken from the Pages configuration rather than hardcoded,
        # so the same build emits correct absolute URLs for the github.io project
        # URL and for the blog.mracovado.com custom domain, with no rebuild and no
        # stored secret. Garbage collection and minification produce the production
        # output; public/ is generated here and never committed.
        run: hugo build --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
